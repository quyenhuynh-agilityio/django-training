services:
  # 1. The Redis Broker (Standard Service Type)
  - type: redis
    name: studyportal-redis
    plan: free
    ipAllowList: [] # Limits access to internal services only

  # 2. Django Web Service
  - type: web
    name: studyportal-api
    runtime: python
    plan: free
    rootDir: studyportal-drf
    buildCommand: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
      source $HOME/.cargo/env
      uv sync --frozen
      source .venv/bin/activate
      python manage.py collectstatic --no-input
      python manage.py migrate
    startCommand: "source .venv/bin/activate && gunicorn core.wsgi:application"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: studyportal-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

  # 3. Celery Worker
  - type: worker
    name: studyportal-worker
    runtime: python
    plan: starter
    rootDir: studyportal-drf
    buildCommand: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
      source $HOME/.cargo/env
      uv sync --frozen
    startCommand: "source .venv/bin/activate && celery -A core worker --loglevel=info"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: studyportal-redis
          property: connectionString
