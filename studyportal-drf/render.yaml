services:
  - type: web
    name: studyportal-drf
    env: python
    plan: free
    region: oregon

    buildCommand: |
      uv sync --frozen
      uv run python manage.py migrate
      uv run python manage.py collectstatic --noinput

    startCommand: uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      # Select production settings via config/settings/__init__.py
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

      # REQUIRED: Set these in the Render dashboard (do NOT commit real values)
      # - key: SECRET_KEY
      #   value: "<your-secure-django-secret-key>"
      # - key: DATABASE_URL
      #   value: "<your-render-postgres-connection-string>"
      # - key: CORS_ALLOWED_ORIGINS
      #   value: "https://your-frontend.example.com"
      # - key: CSRF_TRUSTED_ORIGINS
      #   value: "https://your-frontend.example.com"
      # - key: FRONTEND_URL
      #   value: "https://your-frontend.example.com"

      # Optional email / Sentry / Redis / Celery settings can also be configured here.
